name: GitHub Readme Stats

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *" # Ejecuta a medianoche UTC todos los días
  workflow_dispatch: # Permite ejecutar manualmente

jobs:
  generate-stats:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate Stats
        uses: lowlighter/metrics@latest
        with:
          filename: stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: sanye587-cr7
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Bogota
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: lines-of-code, percentage
          plugin_languages_limit: 5
          plugin_languages_recent_days: 14
          plugin_languages_sections: most-used
          theme: dracula
          config_output: svg
          config_theme: dracula
          config_width: 760
          config_height: 150
          config_font: Inter
          config_font_size: 14
          config_font_weight: 600
          config_background: 00000000
          config_border_radius: 5
          config_border_color: 33FF33
          config_title_color: 33FF33
          config_text_color: 33FF33

      - name: Generate Languages
        uses: lowlighter/metrics@latest
        with:
          filename: languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: sanye587-cr7
          template: classic
          base: languages
          config_timezone: America/Bogota
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: lines-of-code, percentage
          plugin_languages_limit: 5
          plugin_languages_recent_days: 14
          plugin_languages_sections: most-used
          theme: dracula
          config_output: svg
          config_theme: dracula
          config_width: 320
          config_height: 150
          config_font: Inter
          config_font_size: 14
          config_font_weight: 600
          config_background: 00000000
          config_border_radius: 5
          config_border_color: 33FF33
          config_title_color: 33FF33
          config_text_color: 33FF33
